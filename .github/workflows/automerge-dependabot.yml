name: Dependabot auto-merge

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # pinned to a commit of v1; Dependabot (github-actions ecosystem) keeps the pin up to date
      - uses: iobroker-bot-orga/action-automerge-dependabot@v1.1.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
