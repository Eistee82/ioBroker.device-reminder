name: Dependabot auto-merge

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # pinned to the commit of v1.1.3; Dependabot (github-actions ecosystem) updates the SHA.
      # contents: write is needed because the action merges the PR itself.
      - uses: iobroker-bot-orga/action-automerge-dependabot@cdb8d11b3ff0bd8f3b4e9ee41886c187be641fb4 # v1.1.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # rules: patch updates only; the action never merges major updates and waits for all checks
          config-file-path: .github/auto-merge.yml
          wait-for-checks: 'true'
